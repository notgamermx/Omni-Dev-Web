name = "omnidev-web"
compatibility_date = "2024-11-18"
pages_build_output_dir = "dist"

# Cloudflare Pages Functions (Edge Workers)
[functions]
node_compat = true

# Environment variables (set in Cloudflare Dashboard → Pages → Settings → Environment variables)
# SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_ANON_KEY = "your-anon-key"
# SUPABASE_SERVICE_ROLE_KEY = "your-service-role-key" (for admin functions only)
# GITHUB_TOKEN = "ghp_xxx" (for GitHub API + webhook verification)
# GITHUB_WEBHOOK_SECRET = "your-webhook-secret"

# R2 Bucket for assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "omnidev-assets"

# Cron triggers for scheduled tasks
# [triggers]
# cron = "0 3 * * *"  # Daily at 3 AM UTC for release sync